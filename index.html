    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get, set, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // !! ضع هنا بيانات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyBjS690L-HaKYP4Gc7zwqHAgFt1XDBrKsw",
            authDomain: "golden-street.firebaseapp.com",
            databaseURL: "https://golden-street-default-rtdb.firebaseio.com",
            projectId: "golden-street",
            storageBucket: "golden-street.firebasestorage.app",
            messagingSenderId: "688631001187",
            appId: "1:688631001187:web:41f3e365682933a8a60856"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // عداد حقيقي مباشر - مُعرَّف أسفلاً كـ window.listenToCount

        // تسجيل مشترك حقيقي
        async function registerSubscriber(data) {
            const subscribersRef = ref(db, 'subscribers');
            await push(subscribersRef, { ...data, timestamp: Date.now() });
            const snapshot = await get(ref(db, 'subscribers'));
            const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 1;
            await set(ref(db, 'subscribers_count'), count);
            return count;
        }

        window.firebaseReady = true;
        window.registerSubscriber = registerSubscriber;

        // نحفظ دالة إلغاء الاشتراك لتجنب تراكم المستمعين
        let unsubscribeCount = null;

        window.listenToCount = function() {
            // أوقف المستمع القديم إن وجد
            if (unsubscribeCount) unsubscribeCount();
            const countRef = ref(db, 'subscribers_count');
            unsubscribeCount = onValue(countRef, (snapshot) => {
                const count = snapshot.val() || 0;
                document.querySelectorAll('.live-count').forEach(el => {
                    el.textContent = count.toLocaleString();
                });
            });
        };

        // جلب قائمة المشتركين مرتبة
        window.getSubscribers = async function() {
            const snapshot = await get(ref(db, 'subscribers'));
            if (!snapshot.exists()) return [];
            const data = snapshot.val();
            return Object.values(data).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        };

        // IMPROVEMENT #3: التحقق من تكرار البريد الإلكتروني
        window.checkEmailExists = async function(email) {
            const snapshot = await get(ref(db, 'subscribers'));
            if (!snapshot.exists()) return false;
            return Object.values(snapshot.val()).some(
                s => s.email && s.email.toLowerCase() === email.toLowerCase()
            );
        };
    </script>

let counterInterval = null;
function startCounter() {
    // أوقف الـ interval القديم أولاً
    if (counterInterval) { clearInterval(counterInterval); counterInterval = null; }
    counterInterval = setInterval(() => {
        if (window.listenToCount) {
            clearInterval(counterInterval);
            counterInterval = null;
            window.listenToCount();
        }
    }, 100);
}

let lbInterval = null;

function loadLeaderboard(showAll) {
    const container = document.getElementById('leaderboardContainer');
    if (!container) return;

    // أوقف الـ interval القديم
    if (lbInterval) { clearInterval(lbInterval); lbInterval = null; }

    lbInterval = setInterval(async () => {
        if (!window.getSubscribers) return;
        clearInterval(lbInterval);
        lbInterval = null;

        const subscribers = await window.getSubscribers();
        const d = t[lang];

        if (!subscribers || subscribers.length === 0) {
            container.innerHTML = `<div class="lb-empty">${d.lb_empty}</div>`;
            return;
        }

        const limit = 10;
        const visible = subscribers.slice(0, showAll ? subscribers.length : limit);
        const medals = ['rank-1','rank-2','rank-3'];

        const rows = visible.map((s, i) => {
            const rankClass = i < 3 ? medals[i] : 'rank-other';
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1;
            const locale = lang === 'ar' ? 'ar-SA' : lang === 'fr' ? 'fr-FR' : 'en-US';
            const date = s.timestamp ? new Date(s.timestamp).toLocaleDateString(locale, {year:'numeric',month:'short',day:'numeric'}) : '—';
            // XSS protection: escape user input
            const safeName = (s.name || '—').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const safeCountry = (s.country || '—').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const safeSocial = s.social ? s.social.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
            const socialHtml = safeSocial ? `<div class="member-social">${safeSocial}</div>` : '';
            return `<tr class="leaderboard-row">
                <td><span class="rank-badge ${rankClass}">${medal}</span></td>
                <td><div class="member-name">${safeName}</div>${socialHtml}</td>
                <td><div class="member-country">${safeCountry}</div></td>
                <td class="member-date">${date}</td>
            </tr>`;
        }).join('');

        const showMoreBtn = !showAll && subscribers.length > limit
            ? `<button class="lb-show-more" onclick="loadLeaderboard(true)">${d.lb_more} (${subscribers.length - limit}+)</button>`
            : '';

        container.innerHTML = `
            <table class="leaderboard-table">
                <thead><tr>
                    <th>${d.lb_col_rank}</th>
                    <th>${d.lb_col_name}</th>
                    <th>${d.lb_col_country}</th>
                    <th>${d.lb_col_date}</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            ${showMoreBtn}`;
    }, 100);
}

function setupForm() {
    const form = document.getElementById('regForm');
    if (!form) return;
    form.addEventListener('submit', async e => {
        e.preventDefault();
        const loading = document.getElementById('loading');
        const successMsg = document.getElementById('successMsg');
        const rankNum = document.getElementById('rankNum');
        const errMsg = document.getElementById('errMsg');
        const subBtn = document.getElementById('subBtn');
        errMsg.style.display = 'none';
        loading.classList.add('show');
        subBtn.disabled = true;
        try {
            if (!window.registerSubscriber) throw new Error('Firebase not ready');

            // IMPROVEMENT #3: التحقق من تكرار البريد الإلكتروني
            const emailVal = document.getElementById('iEmail').value.trim().toLowerCase();
            if (window.checkEmailExists) {
                const exists = await window.checkEmailExists(emailVal);
                if (exists) {
                    throw new Error('EMAIL_EXISTS');
                }
            }

            const rank = await window.registerSubscriber({
                name: document.getElementById('iName').value.trim(),
                email: emailVal,
                country: document.getElementById('iCountry').value,
                wallet: document.getElementById('iWallet').value.trim(),
                social: document.getElementById('iSocial').value.trim(),
                lang
            });
            loading.classList.remove('show');
            rankNum.textContent = '#' + rank;
            successMsg.classList.add('show');
            form.reset();
            subBtn.disabled = false; // FIX BUG#2: إعادة تفعيل الزر بعد النجاح
            loadLeaderboard(false);
            setTimeout(() => successMsg.classList.remove('show'), 8000);
        } catch(err) {
            console.error(err);
            loading.classList.remove('show');
            // عرض رسالة مختلفة إذا كان البريد مسجلاً مسبقاً
            if (err.message === 'EMAIL_EXISTS') {
                const d = t[lang];
                errMsg.textContent = d.err_duplicate || '⚠️ هذا البريد الإلكتروني مسجّل مسبقاً.';
            }
            errMsg.style.display = 'block';
            subBtn.disabled = false;
        }
    });
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        lang = this.dataset.lang;
        render();
    });
});
